plugins { id 'com.android.application' }

android {
    namespace 'ru.pluschat.app'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.pluschat.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        // Connect directly to the user's main PHP host; no protocol gateway.
        buildConfigField 'String', 'API_BASE_URL', '"https://xn--80avljg2a1c.xn--p1ai/api/v1/"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
}

// Copy the project-root logo into Android resources before resource processing.
def copyPlusChatLogo = tasks.register('copyPlusChatLogo', Copy) {
    from(rootProject.file('8e0e5186-48e8-4af2-8acf-3e8c1439c2b5.jpeg'))
    into(layout.projectDirectory.dir('src/main/res/drawable-nodpi'))
    rename { 'pluschat_logo.jpeg' }
}
tasks.named('preBuild').configure { dependsOn(copyPlusChatLogo) }
