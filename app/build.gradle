        applicationId 'ru.pluschat.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'API_BASE_URL', '"https://xn--n1aabel.xn--80avljg2a1c.xn--p1ai/api/v1/"'
