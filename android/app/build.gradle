plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}
android {
    namespace "ru.pluschat.app"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    signingConfigs {
        // Temporary installable test APK. For production updates, use a private keystore stored as GitHub Actions secrets.
        debug
    }
    buildTypes {
        release {
            // Sign release builds with the standard Android debug certificate so testers can install the APK.
            signingConfig signingConfigs.debug
        }
    }
    defaultConfig {
        applicationId "ru.pluschat.app"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }
}
flutter { source "../.." }
